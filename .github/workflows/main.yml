name: Build IOS
run-name: Build IOS
on:
  workflow_dispatch: {}
  push:
    branches:
      - v4.4.0

jobs:
  Build_IOS:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.44.0"
          architecture: x64
      - name: Select Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_16.4.app 2>/dev/null \
            || sudo xcode-select --switch /Applications/Xcode.app
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Package unsigned ipa
        run: |
          cd "$GITHUB_WORKSPACE/build/ios/iphoneos"
          mkdir -p Payload
          mv Runner.app Payload/
          zip -r app-ios.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: app-ios.ipa
          path: build/ios/iphoneos/app-ios.ipa

  Build_MacOS:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.44.0"
          architecture: x64
      - name: Select Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_16.4.app 2>/dev/null \
            || sudo xcode-select --switch /Applications/Xcode.app
      - run: flutter pub get
      - run: flutter build macos --release
      - uses: actions/upload-artifact@v4
        with:
          name: macos-build.zip
          path: build/macos/Build/Products/Release/pica_comic.app
